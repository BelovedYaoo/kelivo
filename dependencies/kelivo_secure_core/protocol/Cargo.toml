[package]
name = "kelivo_secure_core_protocol"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["system-rng", "device-crypto"]
device-crypto = [
  "dep:curve25519-dalek",
  "dep:ed25519-dalek",
  "dep:hkdf",
  "dep:hpke",
  "dep:hmac",
  "dep:sha2_device",
  "dep:x25519-dalek",
]
system-rng = ["rand/getrandom", "dep:getrandom"]

[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = [
  "alloc",
  "zeroize",
] }
curve25519-dalek = { version = "=4.1.3", default-features = false, optional = true }
ed25519-dalek = { version = "=2.2.0", default-features = false, optional = true, features = [
  "zeroize",
] }
hpke = { version = "=0.14.0", default-features = false, optional = true, features = [
  "chacha",
  "x25519",
] }
hkdf = { version = "=0.13.0", default-features = false, optional = true }
hmac = { version = "=0.13.0", default-features = false, optional = true }
opaque-ke = { version = "=4.0.1", default-features = false, features = [
  "argon2",
  "ristretto255",
] }
rand = { version = "=0.8.5", default-features = false }
sha2_device = { package = "sha2", version = "=0.11.0", default-features = false, optional = true }
sha2_opaque = { package = "sha2", version = "=0.10.9", default-features = false }
x25519-dalek = { version = "=3.0.0", default-features = false, optional = true, features = [
  "zeroize",
] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", optional = true, features = ["js"] }

[lints.rust]
unsafe_code = "forbid"
