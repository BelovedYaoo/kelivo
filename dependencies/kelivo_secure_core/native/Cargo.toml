[package]
name = "kelivo_secure_core_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "kelivo_secure_core"
crate-type = ["cdylib"]

[features]
default = []
test-store-support = []

[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "=0.13.0"
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
kelivo_secure_core_protocol = { path = "../protocol" }
rand = { version = "=0.8.5", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
libc = "=0.2.155"
windows-sys = { version = "=0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "android")'.dependencies]
getrandom = "=0.2.17"
jni = "=0.21.1"
libc = "=0.2.155"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "=0.2.155"

[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "=0.10.1"
core-foundation-sys = "=0.8.7"
security-framework = { version = "=3.7.0", default-features = false }
security-framework-sys = { version = "=2.17.0", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
