name: kelivo_durable_preferences
description: Kelivo 在 Apple 平台使用的可验证耐久偏好存储。
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.1"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: KelivoDurablePreferencesPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: KelivoDurablePreferencesPlugin
        sharedDarwinSource: true
