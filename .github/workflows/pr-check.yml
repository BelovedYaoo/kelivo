name: PR Checks

env:
  FLUTTER_VERSION: '3.44.1'

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Analyze / Test / L10n / Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify secure core FFI bindings
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File tool/verify_secure_core_bindings.ps1

      - name: Dart format (changed files only)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- | grep -E '^(lib|test)/.*\\.dart$' || true)"
          if [ -z "$files" ]; then
            echo "No changed Dart files to format-check."
            exit 0
          fi

          echo "Format-checking files:"
          echo "$files"
          dart format --output=none --set-exit-if-changed $files

      - name: Generate l10n and ensure committed outputs
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: No new untranslated messages (PR)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          BASE_DIR="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true
            rm -rf "$BASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          pushd "$BASE_DIR" >/dev/null
          flutter pub get
          flutter gen-l10n
          popd >/dev/null

          python3 .github/scripts/check_no_new_untranslated.py \
            "$BASE_DIR/desiredFileName.txt" \
            "desiredFileName.txt"

      - name: dart analyze (root package only)
        run: dart analyze --fatal-infos lib test

      - name: flutter test (without Windows secure store tests)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(
            find test -type f -name '*_test.dart' \
              ! -path 'test/core/services/sync/cloud_sync_client_protocol_test.dart' \
              ! -path 'test/core/services/sync/e2ee_account_recovery_checkpoint_test.dart' \
              -print
          )
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo 'No non-secure tests found.' >&2
            exit 1
          fi
          flutter test "${test_files[@]}"

  windows-secure-core:
    name: Windows Secure Core Tests
    runs-on: windows-latest
    env:
      TEMP: C:\Temp
      TMP: C:\Temp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup secure core Rust toolchain
        shell: pwsh
        run: |
          $toolchainLine = Select-String -LiteralPath 'dependencies/kelivo_secure_core/native/rust-toolchain.toml' -Pattern '^channel = "([^"]+)"$'
          if ($toolchainLine.Matches.Count -ne 1) {
            throw '无法解析安全核心 Rust 工具链版本。'
          }
          $toolchain = $toolchainLine.Matches[0].Groups[1].Value
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV

      - name: Prepare isolated temporary directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path 'C:\Temp' -Force | Out-Null

      - name: Flutter pub get
        run: flutter pub get

      - name: Test root secure core integrations
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -NonInteractive
          -File tool/run_secure_core_test.ps1
          -PackageRoot .
          test/core/services/sync/cloud_sync_client_protocol_test.dart
          test/core/services/sync/e2ee_account_recovery_checkpoint_test.dart

      - name: Test secure core package
        shell: pwsh
        run: >-
          pwsh -NoLogo -NoProfile -NonInteractive
          -File tool/run_secure_core_test.ps1
          -PackageRoot dependencies/kelivo_secure_core
